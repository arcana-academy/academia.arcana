services:
  - type: web
    name: academiaarcana
    runtime: node
    branch: main
    # Release freeze (NO-GO): a merged commit must not deploy automatically.
    # Production Smoke is post-deploy evidence, not a promotion gate.
    # Re-enable only after separate, approved release governance.
    # Quoted: YAML 1.1 resolves bare `off` to boolean false, while Render's
    # Blueprint schema requires the string enum "off" | "commit" | "checksPass".
    # See https://render.com/docs/blueprint-spec (example uses 'off').
    autoDeployTrigger: "off"
    buildCommand: node scripts/security/assert-build-secret-isolation-536.cjs && node scripts/verify-dependency-lifecycle-scripts.cjs && npm ci --ignore-scripts && npm rebuild unrs-resolver --ignore-scripts=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NPM_CONFIG_IGNORE_SCRIPTS
        value: "true"
      - key: NEXT_PUBLIC_APP_ENV
        value: production
      - key: NEXT_PUBLIC_APP_URL
        value: https://academiaarcana.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Public sitekey only: never include HCAPTCHA_SECRET in blueprint or build.
      - key: NEXT_PUBLIC_HCAPTCHA_SITEKEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_AGENT_MODEL
        value: gpt-5.6-sol
      - key: NEXT_PUBLIC_ADOBE_FONTS_KIT_ID
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_ASSETS_URL
        sync: false
      - key: NEXT_PUBLIC_HONEYBADGER_REVISION
        sync: false
      - key: MESTRE_ARCANO_WEB_RESEARCH_PROVIDER
        sync: false
      - key: PARALLEL_API_KEY
        sync: false
      - key: PARALLEL_API_BASE_URL
        value: https://api.parallel.ai
      - key: EXA_API_KEY
        sync: false
